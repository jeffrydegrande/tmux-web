{{define "pulls.html"}}
{{if not .Repos}}
  <p class="empty">No open pull requests.</p>
{{else}}
{{range .Repos}}
  {{if .Error}}
  <p class="err">{{.RepoName}}: {{.Error}}</p>
  {{else}}
  {{$repo := .RepoID}}
  <div class="pullgroup">
    <h3 class="grouphead">{{.RepoName}}</h3>
    <ul class="ticketlist">
      {{range .Pulls}}
      <li>
        <button class="start"
                hx-post="/windows"
                hx-vals='{"repo": {{$repo | printf "%q"}}, "name": {{printf "pr-%d" .Number | printf "%q"}}, "prompt": {{printf "deep review on PR %d" .Number | printf "%q"}}}'
                hx-target="#new-result" hx-swap="innerHTML">
          <span class="tid">#{{.Number}}</span>
          <span class="ttitle">{{.Title}}</span>
          <span class="tstate">{{.Author}}</span>
          <span class="spin" aria-hidden="true"></span>
        </button>
      </li>
      {{end}}
    </ul>
  </div>
  {{end}}
{{end}}
{{end}}
{{end}}
